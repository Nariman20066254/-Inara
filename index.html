<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Для Инары ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#0b0418;color:#fff;font-family:"Cormorant Garamond",Georgia,serif;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 100%,#4a0f3d 0%,#1c0834 45%,#07030f 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
 opacity:0;visibility:hidden;transform:scale(1.06);transition:opacity 1s,transform 1s,visibility 1s;z-index:2}
.scene.on{opacity:1;visibility:visible;transform:none}
h1{font-size:clamp(40px,13vw,66px);line-height:1.05;font-weight:700;text-shadow:0 0 28px #ff4f9a}
h2{font-size:clamp(28px,8.5vw,40px);line-height:1.15;font-weight:500;text-shadow:0 0 20px #ff4f9a}
p.sub{font-size:21px;font-style:italic;opacity:.85;margin-top:14px;line-height:1.35}
.hold{margin-top:48px;position:relative;width:150px;height:150px;border:0;background:none;cursor:pointer;touch-action:none}
.hold svg{width:100%;height:100%;overflow:visible}
.hold .ring{fill:none;stroke:#ffd1e3;stroke-width:3;stroke-linecap:round;stroke-dasharray:439.8;stroke-dashoffset:439.8;transform:rotate(-90deg);transform-origin:75px 75px}
.hold .h{fill:#ff3d81;filter:drop-shadow(0 0 16px #ff3d81);transform-origin:75px 75px;animation:beat 1.3s infinite}
@keyframes beat{0%,40%,100%{transform:scale(1)}15%{transform:scale(1.16)}28%{transform:scale(1.04)}}
.hint{font-size:18px;opacity:.7;margin-top:14px;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.3}}
#s2{justify-content:space-between;pointer-events:none}
#count{font-size:22px;opacity:.85}
/* конверт */
.env{position:relative;width:min(82vw,330px);aspect-ratio:1.5;margin-top:44px;cursor:pointer;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 20px 40px #0009)}
@keyframes float{50%{transform:translateY(-12px)}}
.env div{position:absolute;inset:0;border-radius:10px}
.env .back{background:#b72560}
.env .front{background:linear-gradient(#ff7fae,#e8447f);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:2}
.env .flap{background:linear-gradient(#ff9ac0,#f25a92);clip-path:polygon(0 0,100% 0,50% 60%);z-index:3;transform-origin:top;transition:transform .8s}
.env .seal{inset:auto;left:50%;top:58%;width:66px;height:66px;margin:-33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0103f,#7d0020);z-index:4;display:flex;align-items:center;justify-content:center;font:700 34px "Caveat",cursive;box-shadow:0 4px 12px #0007;transition:.4s}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0;transform:scale(2)}
/* письмо */
.paper{width:min(100%,420px);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(#fffaf2,#ffeedd);color:#4a1730;border-radius:18px;padding:22px 22px 18px;box-shadow:0 0 60px #ff4f9a77}
#text{font:500 clamp(21px,6vw,26px)/1.28 "Caveat",cursive;text-align:left;white-space:pre-wrap;overflow-y:auto;min-height:0;height:62vh;touch-action:pan-y;scrollbar-width:none}
.btn{border:0;border-radius:50px;padding:15px 30px;font:700 21px "Cormorant Garamond",serif;color:#fff;background:linear-gradient(135deg,#ff3d81,#a52ad8);box-shadow:0 0 28px #ff3d8199;cursor:pointer;transition:transform .2s,opacity .6s}
.btn:active{transform:scale(.94)}
.hide{opacity:0;pointer-events:none}
.paper .btn{margin-top:14px;flex:none}
#s5{justify-content:flex-end}
#s5 h1{font-size:clamp(38px,12vw,60px)}
.row{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap;justify-content:center}
#sound{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top));z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid #fff4;background:#0005;color:#fff;font-size:20px;display:none}
#flash{position:fixed;inset:0;background:#ffd9e8;opacity:0;pointer-events:none;z-index:4;transition:opacity .9s}
</style>
</head>
<body>
<canvas id="c"></canvas>

<section class="scene on" id="s1">
  <h1>Инара…</h1>
  <p class="sub">Это послание создано<br>только для тебя</p>
  <button class="hold" id="hold" aria-label="Удерживай сердце">
    <svg viewBox="0 0 150 150"><circle class="ring" id="ring" cx="75" cy="75" r="70"/>
    <path class="h" d="M75 112C40 88 30 72 30 58c0-13 10-22 22-22 10 0 18 6 23 15 5-9 13-15 23-15 12 0 22 9 22 22 0 14-10 30-45 54z"/></svg>
  </button>
  <div class="hint">Приложи палец и держи</div>
</section>

<section class="scene" id="s2">
  <div><h2 id="starTitle">Зажги звёзды</h2><p class="sub">Нажимай на мерцающую звезду</p></div>
  <div id="count">0 из 12</div>
</section>

<section class="scene" id="s3">
  <h2>Тебе письмо</h2>
  <div class="env" id="env"><div class="back"></div><div class="front"></div><div class="flap"></div><div class="seal">Н</div></div>
  <div class="hint" style="margin-top:36px">Нажми на печать</div>
</section>

<section class="scene" id="s4">
  <div class="paper">
    <div id="text"></div>
    <button class="btn hide" id="next">Это ещё не всё ✨</button>
  </div>
</section>

<section class="scene" id="s5">
  <div id="final">
    <h1 id="ft">Я люблю тебя</h1>
    <p class="sub" id="fs">А ты меня?<br>— Нариман</p>
    <div class="row" id="answers">
      <button class="btn yes">Да ❤️</button>
      <button class="btn yes">Очень да 🥹</button>
    </div>
  </div>
</section>

<button id="sound" aria-label="Звук">🔊</button>
<div id="flash"></div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),x=cv.getContext('2d');
let W,H,D,scene=1,parts=[],sparks=[],bg=[],floats=[],stars=[],lit=0,t=0;
const COL=['#ff3d81','#ff7fae','#ffd1e3','#c86bff','#ffd36b'];
const rnd=(a,b)=>a+Math.random()*(b-a);
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

function heart(a){return[16*Math.sin(a)**3,-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))]}
function resize(){
  D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);
  bg=Array.from({length:130},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.4,1.6),p:rnd(0,7)}));
  const s=Math.min(W/40,H/60);
  stars=Array.from({length:12},(_,i)=>{const[a,b]=heart(i/12*Math.PI*2);return{x:W/2+a*s,y:H*.52+b*s}});
  if(scene==5)shape(finalPhase);
}

/* частицы, собирающиеся в фигуры */
function textPoints(str){
  const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');
  let f=100;g.font=`700 ${f}px "Cormorant Garamond",serif`;
  f=Math.min(150,f*W*.88/g.measureText(str).width);
  g.font=`700 ${f}px "Cormorant Garamond",serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(str,W/2,H*.34);
  const d=g.getImageData(0,0,W,H).data,pts=[];
  for(let y=0;y<H;y+=3)for(let i=0;i<W;i+=3)if(d[(y*W+i)*4+3]>128)pts.push([i,y]);
  return pts;
}
function heartPoints(){
  const s=Math.min(W/37,H/62),pts=[];
  for(let i=0;i<1100;i++){const[a,b]=heart(rnd(0,7)),k=i<650?rnd(.93,1.02):Math.sqrt(Math.random());pts.push([W/2+a*s*k,H*.34+b*s*k])}
  return pts;
}
let finalPhase='name',isHeart=false;
function shape(kind){
  finalPhase=kind;isHeart=kind=='heart';
  let pts=isHeart?heartPoints():textPoints('Инара');
  pts.sort(()=>Math.random()-.5);pts=pts.slice(0,1300);
  while(parts.length<pts.length)parts.push({x:rnd(0,W),y:rnd(0,H),vx:0,vy:0,c:COL[Math.random()*COL.length|0]});
  parts.length=pts.length;
  parts.forEach((p,i)=>{p.tx=pts[i][0];p.ty=pts[i][1]});
}
function burst(px,py,n=60,pow=6){
  const c=COL[Math.random()*COL.length|0];
  for(let i=0;i<n;i++){const a=rnd(0,7),v=rnd(1,pow);sparks.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c})}
}
function mini(px,py,s,c){x.fillStyle=c;x.beginPath();x.moveTo(px,py+s);x.bezierCurveTo(px-s*1.8,py-s*.2,px-s*.7,py-s*1.4,px,py-s*.4);x.bezierCurveTo(px+s*.7,py-s*1.4,px+s*1.8,py-s*.2,px,py+s);x.fill()}

function draw(){
  t+=.016;x.clearRect(0,0,W,H);
  x.fillStyle='#fff';
  for(const s of bg){x.globalAlpha=.35+.35*Math.sin(t*2+s.p);x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}
  if(Math.random()<(scene==5?.18:.04))floats.push({x:rnd(0,W),y:H+20,s:rnd(5,13),v:rnd(.5,1.5),p:rnd(0,7)});
  floats=floats.filter(f=>f.y>-30);
  for(const f of floats){f.y-=f.v;x.globalAlpha=.35;mini(f.x+Math.sin(t+f.p)*18,f.y,f.s,'#ff5c97')}
  x.globalAlpha=1;
  if(scene==2){
    x.strokeStyle='#ffb3d1';x.lineWidth=2;x.shadowColor='#ff3d81';x.shadowBlur=12;
    x.beginPath();for(let i=0;i<lit;i++)x[i?'lineTo':'moveTo'](stars[i].x,stars[i].y);if(lit==12)x.closePath();x.stroke();
    stars.forEach((s,i)=>{
      const on=i<lit,nx=i==lit,r=on?6:nx?8+3*Math.sin(t*7):3;
      x.fillStyle=on?'#fff':nx?'#ffd36b':'#ffffff66';x.beginPath();
      for(let k=0;k<8;k++){const a=k*Math.PI/4,q=k%2?r*.4:r*1.5;x.lineTo(s.x+Math.cos(a)*q,s.y+Math.sin(a)*q)}x.fill();
      if(nx){x.strokeStyle='#ffd36b88';x.beginPath();x.arc(s.x,s.y,18+(t*22%16),0,7);x.stroke()}
    });x.shadowBlur=0;
  }
  if(scene==5){
    const beat=isHeart?1+.05*Math.max(0,Math.sin(t*5))**3:1;
    for(const p of parts){
      const tx=W/2+(p.tx-W/2)*beat,ty=H*.34+(p.ty-H*.34)*beat;
      p.vx=(p.vx+(tx-p.x)*.012)*.86;p.vy=(p.vy+(ty-p.y)*.012)*.86;p.x+=p.vx;p.y+=p.vy;
      x.fillStyle=p.c;x.fillRect(p.x-1.2,p.y-1.2,2.5,2.5);
    }
  }
  x.globalCompositeOperation='lighter';
  sparks=sparks.filter(s=>s.l>0);
  for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vy+=.06;s.vx*=.98;s.l-=.016;x.globalAlpha=Math.max(s.l,0);x.fillStyle=s.c;x.beginPath();x.arc(s.x,s.y,2.4,0,7);x.fill()}
  x.globalAlpha=1;x.globalCompositeOperation='source-over';
  requestAnimationFrame(draw);
}

/* нежная мелодия, создаётся прямо в браузере */
let ac,vol,step=0,muted=false;
function music(){
  if(ac)return;
  try{
    ac=new(window.AudioContext||window.webkitAudioContext)();vol=ac.createGain();vol.gain.value=.5;vol.connect(ac.destination);
    const ch=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,261.6,329.6,440],[196,293.7,392,493.9]];
    setInterval(()=>{if(muted||document.hidden)return;const c=ch[(step/8|0)%4];tone(c[[0,1,2,3,2,1,3,2][step%8]]*2,.12,1.4);if(step%8==0)tone(c[0]/2,.16,3);step++},420);
    $('sound').style.display='block';
  }catch(e){}
}
function tone(f,g,d){const o=ac.createOscillator(),a=ac.createGain(),n=ac.currentTime;o.frequency.value=f;a.gain.setValueAtTime(0,n);a.gain.linearRampToValueAtTime(g,n+.03);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a).connect(vol);o.start(n);o.stop(n+d)}
$('sound').onclick=()=>{muted=!muted;vol.gain.value=muted?0:.5;$('sound').textContent=muted?'🔇':'🔊';if(!muted)ac.resume()};

function go(n){scene=n;document.querySelectorAll('.scene').forEach((e,i)=>e.classList.toggle('on',i==n-1))}
function flash(){$('flash').style.transition='none';$('flash').style.opacity=.9;requestAnimationFrame(()=>requestAnimationFrame(()=>{$('flash').style.transition='opacity .9s';$('flash').style.opacity=0}))}

/* 1: удержание сердца */
let holding=false,prog=0,last=0,looping=false;
function holdLoop(now){
  const dt=Math.min(now-last,50);last=now;
  prog=Math.max(0,Math.min(1,prog+(holding?dt/2000:-dt/700)));
  $('ring').style.strokeDashoffset=439.8*(1-prog);
  $('hold').style.transform=`scale(${1+prog*.25})`;
  if(holding&&Math.random()<prog*.3){const r=$('hold').getBoundingClientRect();burst(r.x+r.width/2,r.y+r.height/2,6,4)}
  if(prog>=1){buzz([80,50,150]);flash();burst(W/2,H/2,200,11);go(2);return}
  if(scene==1&&(holding||prog>0))requestAnimationFrame(holdLoop);else looping=false;
}
$('hold').addEventListener('pointerdown',e=>{e.preventDefault();holding=true;buzz(30);music()});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>{holding=false;if(ac&&!muted)ac.resume()}));
$('hold').addEventListener('keydown',e=>{if(e.key=='Enter'||e.key==' ')holding=true});
addEventListener('keyup',()=>holding=false);
addEventListener('contextmenu',e=>e.preventDefault());

/* 2: созвездие */
cv.addEventListener('pointerdown',e=>{
  if(scene==2&&lit<12){
    const s=stars[lit];
    if(Math.hypot(e.clientX-s.x,e.clientY-s.y)<48){
      lit++;burst(s.x,s.y,24,4);buzz(25);if(ac)tone(440*2**(lit/12),.25,.8);
      $('count').textContent=lit+' из 12';
      if(lit==12){$('starTitle').textContent='Это моё сердце';buzz([60,60,200]);
        for(let i=0;i<6;i++)setTimeout(()=>burst(rnd(40,W-40),rnd(H*.25,H*.75),70),i*220);
        setTimeout(()=>go(3),2600)}
    }
  }else burst(e.clientX,e.clientY,30,4);
});

/* 3–4: конверт и письмо */
const LETTER=`Моя Инара,

я долго думал, как сказать тебе это. Обычного сообщения слишком мало, поэтому я решил подарить тебе целое небо.

Когда ты улыбаешься, у меня внутри включается свет. Когда ты рядом, даже самый простой день хочется запомнить.

Мне нравится твой голос, твой смех и то, как одно твоё «привет» меняет всё моё настроение.

Я не обещаю достать тебе все звёзды. Я обещаю быть рядом, беречь тебя, слушать и радовать — не только в красивые дни, но и в трудные.

Если бы мне снова пришлось выбирать из всех людей на свете, я бы всё равно искал тебя.

Навсегда твой,
Нариман ❤`;
$('env').onclick=()=>{
  if($('env').classList.contains('open'))return;
  $('env').classList.add('open');buzz(60);
  const r=$('env').getBoundingClientRect();burst(r.x+r.width/2,r.y+r.height/2,120,8);
  setTimeout(()=>{go(4);setTimeout(type,900)},1200);
};
function type(){
  const el=$('text'),a=[...LETTER];let i=0,done=false;
  const end=()=>{done=true;el.textContent=LETTER;$('next').classList.remove('hide')};
  /* двойное касание показывает письмо сразу */
  let tap=0;el.onclick=()=>{const n=Date.now();if(n-tap<350&&!done){end();el.scrollTop=el.scrollHeight}tap=n};
  (function step(){if(done)return;el.textContent=a.slice(0,++i).join('');el.scrollTop=el.scrollHeight;
    if(i>=a.length)return end();setTimeout(step,/[.,!?]/.test(a[i-1])?260:42)})();
}

/* 5: финал */
$('next').onclick=()=>{
  flash();go(5);$('final').style.cssText='opacity:0;pointer-events:none;transition:opacity 1.5s';
  parts=[];shape('name');buzz(100);
  setTimeout(()=>{shape('heart');burst(W/2,H*.34,180,10);buzz([100,80,100])},3800);
  setTimeout(()=>{$('final').style.opacity=1;$('final').style.pointerEvents='auto'},5600);
};
document.querySelectorAll('.yes').forEach(b=>b.onclick=()=>{
  $('ft').textContent='Я самый счастливый!';
  $('fs').innerHTML='А теперь напиши мне это<br>или обними при встрече 🤍<br>— твой Нариман';
  $('answers').remove();buzz([100,60,100,60,300]);flash();
  for(let i=0;i<22;i++)setTimeout(()=>burst(rnd(30,W-30),rnd(40,H*.7),80,8),i*200);
});

addEventListener('resize',()=>{if(innerWidth!=W||Math.abs(innerHeight-H)>120)resize()});
resize();draw();
function startHold(){if(!looping){looping=true;last=performance.now();requestAnimationFrame(holdLoop)}}
$('hold').addEventListener('pointerdown',startHold);$('hold').addEventListener('keydown',startHold);
document.fonts&&document.fonts.load('700 100px "Cormorant Garamond"','Инара').catch(()=>{});
</script>
</body>
</html>
